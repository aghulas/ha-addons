name: Weishaupt2MQTT
version: "0.1.1"
slug: weishaupt2mqtt
description: All-in-one Weishaupt eBUS to functional MQTT bridge (bundles ebusd, definitions, and write guards)
url: https://github.com/aghulas/weishaupt2mqtt
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
services:
  - mqtt:want
map:
  - data:rw
options:
  ebusd_external: false
  ebus_device: "ens:10.77.20.230:9999"
  ebusd_address: "31"
  ebusd_host: "127.0.0.1"
  ebusd_port: 8888
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  base_topic: "weishaupt"
  writes_enabled: false
  installer_writes_enabled: false
  allow_stock_ebusd: false
  max_writes_per_hour: 30
  clock_sync_enabled: false
  log_level: "INFO"
schema:
  ebusd_external: bool
  ebus_device: str?
  ebusd_address: str
  ebusd_host: str
  ebusd_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  base_topic: str
  writes_enabled: bool
  installer_writes_enabled: bool
  allow_stock_ebusd: bool
  max_writes_per_hour: "int(1,200)"
  clock_sync_enabled: bool
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
