name: eBUSd (Weishaupt CRC)
version: "26.1.10-weishaupt.2"
slug: ebusd
description: >
  The eBUSd app with the ebusd build of aghulas/ebusd, which computes the run-time
  checksum needed to write settings of Weishaupt controllers (WTC, Kromschröder WCM).
url: https://github.com/aghulas/ebusd/tree/weishaupt
arch:
  - aarch64
  - amd64

init: false
startup: services
ingress: true
ingress_port: 7681
services:
  - mqtt:want
uart: true
map:
  - app_config:rw
  - share:rw
ports:
  8888/tcp: null
  8889/tcp: null
ports_description:
  8888/tcp: eBUSd TCP command port
  8889/tcp: eBUSd HTTP port (set --httpport=8889 in commandline_options to enable)
options:
  seed_mqtt_cfg: true
  commandline_options:
    - "--mqttjson"
  sqlite_retention_days: 10
schema:
  device: "device(subsystem=tty)?"
  network_device: "str?"
  seed_mqtt_cfg: bool
  commandline_options: ["str"]
  sqlite_db: "str?"
  sqlite_retention_days: "int(0,)"
